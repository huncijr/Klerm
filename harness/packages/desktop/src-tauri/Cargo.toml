[package]
name = "klerm-desktop"
default-run = "klerm-desktop"
version = "0.0.1"
description = "Klerm desktop application"
authors = ["Klerm contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "klerm_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", default-features = false, features = ["wry"] }
tauri-plugin-dialog = "2.7.2"

[target.'cfg(target_os = "linux")'.dependencies]
cef = { version = "=154.0.0", default-features = false, features = ["sandbox"] }
png = "=0.17.16"
base64 = "=0.23.1"
