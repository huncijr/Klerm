[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "klerm-browser-worker"
version = "0.1.0"
description = "Isolated, read-only browser-use worker for Klerm"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "browser-use==0.13.10",
]

[project.scripts]
klerm-browser-worker = "klerm_browser_worker.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/klerm_browser_worker"]

[tool.uv]
package = true
